apiVersion: batch/v1
kind: Job
metadata:
  name: pr-sandbox-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sandbox
          image: pr-sandbox:v1
          imagePullPolicy: Never
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]